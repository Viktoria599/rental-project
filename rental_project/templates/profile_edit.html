{% extends 'base.html' %}

{% block title %}Редактирование профиля - TempThings{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="background: #FFFFFF; border-radius: 24px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #E8E9D6;">
        <h1 style="margin-bottom: 32px; color: #2D2D2D; font-size: 28px;">
            Редактирование профиля
        </h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #2D2D2D; font-size: 14px;">
                    Имя
                </label>
                <input type="text" name="first_name" value="{{ user.first_name }}" 
                       maxlength="50" 
                       placeholder="Введите ваше имя"
                       style="width: 100%; padding: 14px 16px; border: 1px solid #D0D2C0; border-radius: 12px; font-size: 15px; transition: all 0.2s; background: #F7F7E7; color: #2D2D2D;">
            </div>
            
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #2D2D2D; font-size: 14px;">
                    Фамилия
                </label>
                <input type="text" name="last_name" value="{{ user.last_name }}" 
                       maxlength="50" 
                       placeholder="Введите вашу фамилию"
                       style="width: 100%; padding: 14px 16px; border: 1px solid #D0D2C0; border-radius: 12px; font-size: 15px; transition: all 0.2s; background: #F7F7E7; color: #2D2D2D;">
            </div>
            
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #2D2D2D; font-size: 14px;">
                    Телефон
                </label>
                <input type="tel" name="phone" id="phone" value="{{ user.phone|default:'' }}" 
                       placeholder="+7 900 123-45-67" 
                       maxlength="18"
                       style="width: 100%; padding: 14px 16px; border: 1px solid #D0D2C0; border-radius: 12px; font-size: 15px; transition: all 0.2s; background: #F7F7E7; color: #2D2D2D;">
                <p style="margin-top: 8px; font-size: 12px; color: #B0B2A0;">
                    Формат: +7 XXX XXX-XX-XX
                </p>
            </div>
            
            <div style="margin-bottom: 32px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #2D2D2D; font-size: 14px;">
                    Город
                </label>
                <input type="text" name="city" value="{{ user.city|default:'' }}" 
                       placeholder="Например: Москва, Санкт-Петербург" 
                       maxlength="100"
                       style="width: 100%; padding: 14px 16px; border: 1px solid #D0D2C0; border-radius: 12px; font-size: 15px; transition: all 0.2s; background: #F7F7E7; color: #2D2D2D;">
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <button type="submit" class="btn" style="background: #A5AFF5; color: #FFFFFF; padding: 14px 32px; border: none; border-radius: 40px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; flex: 1;">
                    Сохранить
                </button>
                <a href="{% url 'profile' %}" style="background: #F7F7E7; color: #A5AFF5; padding: 14px 32px; text-decoration: none; border: 1px solid #D0D2C0; border-radius: 40px; font-weight: 600; transition: all 0.2s; text-align: center; flex: 1;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    input:focus {
        outline: none;
        border-color: #A5AFF5 !important;
        box-shadow: 0 0 0 3px rgba(165,175,245,0.15);
        background: #FFFFFF !important;
    }
    
    .btn:hover {
        background: #8F9AED !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(165,175,245,0.3);
    }
    
    a:hover {
        background: #A5AFF5 !important;
        color: #FFFFFF !important;
        border-color: #A5AFF5 !important;
    }
</style>

<script>
    // Маска для телефона
    const phoneInput = document.getElementById('phone');
    
    phoneInput.addEventListener('input', function(e) {
        let value = this.value;
        
        // Удаляем всё, кроме цифр и +
        let cleaned = value.replace(/[^\d\+]/g, '');
        
        // Если не начинается с +7, то добавляем +7
        if (!cleaned.startsWith('+')) {
            cleaned = '+' + cleaned;
        }
        
        // Если есть + но нет 7 после него
        if (cleaned.startsWith('+') && cleaned.length >= 2 && cleaned[1] !== '7') {
            cleaned = '+7' + cleaned.slice(1);
        }
        
        // Форматируем: +7 900 123-45-67
        let formatted = '';
        const digits = cleaned.replace(/\D/g, '');
        
        if (digits.length >= 1 && digits.length <= 11) {
            const match = digits.match(/^(\d{1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})$/);
            if (match) {
                let result = '+' + match[1];
                if (match[2]) result += ' ' + match[2];
                if (match[3]) result += ' ' + match[3];
                if (match[4]) result += '-' + match[4];
                if (match[5]) result += '-' + match[5];
                formatted = result;
            }
        }
        
        this.value = formatted.slice(0, 18);
    });
</script>
{% endblock %}
