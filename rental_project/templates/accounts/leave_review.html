{% extends 'base.html' %}

{% block title %}Написать отзыв - TempThings{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card" style="background: #FCFAFA; border: 1px solid #ECECEC; padding: 30px;">
        
        <h1 style="margin-bottom: 10px; color: #3B3B3B;">Написать отзыв</h1>
        <p style="color: #666; margin-bottom: 25px;">
            Пользователь: <strong>{{ reviewed_user.get_full_name|default:reviewed_user.username }}</strong>
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 10px; font-weight: 500; color: #3B3B3B;">Ваша оценка *</label>
                <div style="display: flex; gap: 10px; font-size: 40px; cursor: pointer;" id="star-rating">
                    <span data-value="1" style="color: #ddd;">★</span>
                    <span data-value="2" style="color: #ddd;">★</span>
                    <span data-value="3" style="color: #ddd;">★</span>
                    <span data-value="4" style="color: #ddd;">★</span>
                    <span data-value="5" style="color: #ddd;">★</span>
                </div>
                <input type="hidden" name="rating" id="rating-value" required>
            </div>
            
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 10px; font-weight: 500; color: #3B3B3B;">Ваш комментарий</label>
                <textarea name="comment" rows="5" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 14px; font-family: inherit;"></textarea>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <button type="submit" style="background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 40px; cursor: pointer;">
                    Отправить отзыв
                </button>
                <a href="{% url 'profile' username=reviewed_user.username %}" style="padding: 12px 30px; text-decoration: none; color: #3B3B3B; border: 1px solid #ECECEC; border-radius: 40px;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    const stars = document.querySelectorAll('#star-rating span');
    const ratingInput = document.getElementById('rating-value');
    
    stars.forEach(star => {
        star.addEventListener('mouseenter', function() {
            const value = parseInt(this.dataset.value);
            highlightStars(value);
        });
        
        star.addEventListener('mouseleave', function() {
            const currentValue = parseInt(ratingInput.value) || 0;
            highlightStars(currentValue);
        });
        
        star.addEventListener('click', function() {
            const value = parseInt(this.dataset.value);
            ratingInput.value = value;
            highlightStars(value);
        });
    });
    
    function highlightStars(count) {
        stars.forEach((star, index) => {
            star.style.color = index < count ? '#f5a623' : '#ddd';
        });
    }
    
    {% if existing_review %}
        ratingInput.value = {{ existing_review.rating }};
        highlightStars({{ existing_review.rating }});
    {% endif %}
</script>
{% endblock %}
